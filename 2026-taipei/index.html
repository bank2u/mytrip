<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทริปไต้หวัน · 6–12 ธ.ค. 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇹🇼</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF;
    --canvas: #DCE5F0;
    --margin: #F3F6FA;
    --margin-deep: #E4EAF2;
    --gutter-bg: #F3F6FA;
    --ink: #14181F;
    --ink-soft: #464E59;
    --rule: #CFCBC2;
    --rule-strong: #14181F;
    --navy: #14365D;
    --navy-tint: #EDF2F8;
    --vermilion: #B8232A;
    --vermilion-tint: #FCEFF0;
    --contour: #7C5836;
    --gold-line: #E2BE7E;
    --lake: #135D7D;
    --lake-tint: #E8F4F8;
    --terracotta: #9E4414;
    --terracotta-tint: #FDF2E9;
    --forest: #2E6140;
    --forest-tint: #EBF3ED;
    --mrt-red: #B8232A;
    --mrt-green: #2E6140;
    --taxi: #F2B705;
    --transit: #1E3A5F;
    --warn-bg: #FDF4E1;
    --warn-ink: #6B3E00;
    --warn-line: #B86B00;
    --font-sans: 'Anuphan', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-tc: 'Noto Sans TC', 'Anuphan', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; }

  html {
    scrollbar-color: var(--navy) var(--margin);
    scroll-behavior: smooth;
  }

  ::selection {
    background: var(--navy);
    color: #FFFFFF;
  }

  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    overflow-x: clip;
  }

  a {
    color: var(--navy);
    text-underline-offset: 3px;
  }

  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }

  :focus-visible {
    outline: 3px solid var(--navy);
    outline-offset: 2px;
  }

  .skip-link {
    position: absolute;
    left: -9999px;
    top: 8px;
    background: var(--ink);
    color: #FFFFFF;
    padding: 10px 16px;
    font-weight: 700;
    z-index: 100;
  }
  .skip-link:focus { left: 12px; }

  .shell {
    max-width: 960px;
    margin: 0 auto;
    background: var(--paper);
    min-height: 100vh;
    border-left: 1px solid var(--rule);
    border-right: 1px solid var(--rule);
  }

  @media (max-width: 960px) {
    .shell {
      border-left: none;
      border-right: none;
    }
  }

  /* Masthead frame: Taiwan Navy ground with warm gold contours & vermilion anchor */
  .masthead {
    position: relative;
    background: var(--navy);
    border-bottom: 3px solid var(--vermilion);
    padding: 18px 16px 14px;
    overflow: hidden;
    color: #FFFFFF;
  }

  @media (min-width: 680px) {
    .masthead { padding: 24px 28px 18px; }
  }

  .contour-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0.38;
  }

  .masthead-inner {
    position: relative;
    z-index: 1;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.6rem, 4.8vw, 2.3rem);
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #FFFFFF;
    text-wrap: balance;
  }

  .trip-dates {
    margin: 6px 0 0;
    font-size: 1rem;
    font-weight: 500;
    color: var(--navy-tint);
  }

  /* Primary 4-section navigation */
  .primary-nav {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--paper);
    border-bottom: 2px solid var(--rule-strong);
  }

  .nav-tab {
    min-height: 50px;
    padding: 8px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--ink-soft);
    border-right: 1px solid var(--rule);
    border-bottom: 3px solid transparent;
    transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out);
  }
  .nav-tab:last-child { border-right: none; }
  .nav-tab:hover { background: var(--margin); color: var(--ink); }
  .nav-tab[aria-selected="true"] {
    background: var(--navy-tint);
    color: var(--navy);
    border-bottom-color: var(--vermilion);
    font-weight: 700;
  }

  @media (min-width: 640px) {
    .nav-tab {
      flex-direction: row;
      gap: 8px;
      font-size: 1rem;
    }
  }

  /* Single-row Sticky Day Rail: [ทุกวัน] + (D0)-(D7) */
  .course-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--margin);
    border-bottom: 2px solid var(--rule-strong);
    padding: 6px 2px;
  }

  @media (min-width: 680px) {
    .course-bar { padding: 8px 28px; }
  }

  .course-bar[hidden] { display: none; }

  .day-rail {
    position: relative;
    display: grid;
    grid-template-columns: 44px repeat(8, minmax(0, 1fr));
    gap: 0;
    align-items: center;
    padding: 2px 0;
  }

  @media (min-width: 520px) {
    .day-rail {
      grid-template-columns: 68px repeat(8, minmax(0, 1fr));
      gap: 4px;
    }
  }

  .day-rail::before {
    content: "";
    position: absolute;
    left: calc(44px + (100% - 44px) / 16);
    right: calc((100% - 44px) / 16);
    top: 20px;
    height: 2px;
    background: var(--navy);
    opacity: 0.28;
    z-index: 0;
  }

  @media (min-width: 520px) {
    .day-rail::before {
      left: calc(72px + (100% - 100px) / 16);
      right: calc((100% - 100px) / 16);
      top: 22px;
    }
  }

  .all-btn {
    position: relative;
    z-index: 1;
    width: 44px;
    min-height: 46px;
    padding: 2px;
    border: 1.5px solid var(--navy);
    background: var(--paper);
    color: var(--navy);
    font-size: 0.75rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.15;
  }

  @media (min-width: 520px) {
    .all-btn {
      width: auto;
      font-size: 0.875rem;
      padding: 4px 8px;
    }
  }

  .all-btn:hover { background: var(--navy-tint); }
  .all-btn[aria-pressed="true"] {
    background: var(--navy);
    color: #FFFFFF;
  }

  /* Regional Taiwan route accents per zone */
  .cp-btn[data-zone="dep"], .day-section[data-zone="dep"] {
    --day-accent: var(--navy);
    --day-tint: var(--navy-tint);
  }
  .cp-btn[data-zone="lake"], .day-section[data-zone="lake"] {
    --day-accent: var(--lake);
    --day-tint: var(--lake-tint);
  }
  .cp-btn[data-zone="old"], .day-section[data-zone="old"] {
    --day-accent: var(--vermilion);
    --day-tint: var(--vermilion-tint);
  }
  .cp-btn[data-zone="coast"], .day-section[data-zone="coast"] {
    --day-accent: var(--terracotta);
    --day-tint: var(--terracotta-tint);
  }
  .cp-btn[data-zone="city"], .day-section[data-zone="city"] {
    --day-accent: var(--navy);
    --day-tint: var(--navy-tint);
  }

  .cp-btn {
    position: relative;
    z-index: 1;
    width: 100%;
    min-height: 48px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 2px 0;
  }

  .cp-circle {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--day-accent, var(--navy));
    background: var(--paper);
    color: var(--day-accent, var(--navy));
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 140ms var(--ease-out), background-color 140ms var(--ease-out);
  }

  @media (min-width: 440px) {
    .cp-circle {
      width: 36px;
      height: 36px;
      font-size: 0.875rem;
    }
  }

  .cp-btn:hover .cp-circle {
    background: var(--day-tint, var(--navy-tint));
  }

  .cp-btn[aria-current="true"] .cp-circle {
    background: var(--day-accent, var(--navy));
    color: #FFFFFF;
    box-shadow: 0 0 0 3px var(--day-tint, var(--navy-tint));
  }

  .cp-btn.is-today:not([aria-current="true"]) .cp-circle {
    border-color: var(--vermilion);
    color: var(--vermilion);
  }

  .cp-date {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--ink-soft);
    white-space: nowrap;
    line-height: 1.25;
  }
  .cp-date-full { display: none; }

  @media (min-width: 520px) {
    .cp-date-short { display: none; }
    .cp-date-full { display: inline; }
  }

  .cp-date.is-today-date {
    background: var(--vermilion);
    color: #FFFFFF;
    font-weight: 700;
    padding: 1px 5px;
  }

  /* Main reading column */
  main {
    padding: 16px 12px 36px;
  }

  @media (min-width: 680px) {
    main { padding: 24px 28px 56px; }
  }

  .panel[hidden] { display: none; }

  .panel-enter {
    animation: panelFade 160ms var(--ease-out);
  }

  @keyframes panelFade {
    from { opacity: 0.8; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Day block & Control Description Table */
  .day-section {
    margin-bottom: 20px;
    scroll-margin-top: 84px;
  }
  @media (min-width: 680px) {
    .day-section {
      margin-bottom: 28px;
      scroll-margin-top: 90px;
    }
  }
  .day-section[hidden] { display: none; }

  .day-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 6px 12px;
    padding: 10px 12px;
    background: var(--day-tint, var(--navy-tint));
    border: 1.5px solid var(--rule-strong);
    border-top: 4px solid var(--day-accent, var(--navy));
  }

  @media (min-width: 680px) {
    .day-header { padding: 12px 16px; }
  }

  .day-header h2 {
    margin: 0;
    font-size: clamp(1.25rem, 3.6vw, 1.6rem);
    line-height: 1.25;
    font-weight: 700;
    color: var(--ink);
  }

  .day-code {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 2px 8px;
    margin-right: 8px;
    background: var(--day-accent, var(--navy));
    color: #FFFFFF;
    font-family: var(--font-mono);
    font-size: 0.9375rem;
    line-height: 1.25;
    vertical-align: middle;
  }

  .today-pill {
    background: var(--vermilion);
    color: #FFFFFF;
    font-size: 0.875rem;
    font-weight: 700;
    padding: 2px 10px;
  }

  /* Day condition ribbon with semantic icons */
  .cond-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    padding: 8px 12px;
    background: var(--gutter-bg);
    border-left: 1.5px solid var(--rule-strong);
    border-right: 1.5px solid var(--rule-strong);
    border-bottom: 1.5px solid var(--rule-strong);
    font-size: 0.9375rem;
    font-weight: 500;
  }

  .cond-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .cond-item svg {
    color: var(--day-accent, var(--navy));
    flex-shrink: 0;
  }

  /* Control Description Table */
  .ctrl-table {
    border: 1.5px solid var(--rule-strong);
    border-top: none;
    background: var(--paper);
  }

  .ctrl-row {
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr);
    border-bottom: 1px solid var(--rule);
  }
  .ctrl-row:last-child { border-bottom: none; }

  @media (min-width: 680px) {
    .ctrl-row {
      grid-template-columns: 108px minmax(0, 1fr);
    }
  }

  .ctrl-row.is-optional {
    background: #FAFBFD;
  }

  .ctrl-time {
    padding: 10px 6px;
    border-right: 1px solid var(--rule);
    background: var(--gutter-bg);
    font-family: var(--font-mono);
    color: var(--day-accent, var(--navy));
    line-height: 1.25;
    overflow: hidden;
  }

  .time-start {
    display: block;
    font-size: 1rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .time-end {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--ink-soft);
    white-space: nowrap;
    margin-top: 2px;
  }

  @media (min-width: 680px) {
    .ctrl-time {
      padding: 14px 12px;
    }
    .time-start { font-size: 1.0625rem; }
    .time-end { font-size: 0.9375rem; }
  }

  .ctrl-body {
    padding: 10px 10px;
    min-width: 0;
  }

  @media (min-width: 680px) {
    .ctrl-body {
      padding: 14px 18px;
    }
  }

  .ctrl-content-wrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 4px;
    align-items: start;
  }

  .ctrl-content-wrap.has-thumb {
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px 10px;
  }

  .ctrl-head-line {
    grid-column: 1;
    grid-row: 1;
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .thumb-btn {
    grid-column: 2;
    grid-row: 1;
  }

  .place-title {
    margin: 0;
    font-size: 1.0625rem;
    font-weight: 700;
    line-height: 1.38;
    color: var(--ink);
  }

  .transit-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.8125rem;
    font-weight: 700;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .t-mrt-red { background: var(--mrt-red); color: #FFFFFF; }
  .t-mrt-green { background: var(--mrt-green); color: #FFFFFF; }
  .t-taxi { background: var(--taxi); color: var(--ink); border: 1px solid var(--ink); }
  .t-bus { background: var(--transit); color: #FFFFFF; }
  .t-walk { background: var(--margin); color: var(--ink); border: 1px solid var(--ink); }
  .t-flight { background: var(--ink); color: #FFFFFF; }

  .badge-group {
    display: inline-flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }

  .optional-mark {
    display: inline-flex;
    align-items: center;
    font-size: 0.8125rem;
    font-weight: 700;
    color: var(--navy);
    border: 1.5px dashed var(--navy);
    padding: 2px 7px;
    white-space: nowrap;
  }

  .ctrl-desc {
    grid-column: 1 / -1;
    grid-row: 2;
    margin: 2px 0 0;
    font-size: 1rem;
    color: var(--ink);
    max-width: 68ch;
  }

  @media (min-width: 680px) {
    .ctrl-content-wrap.has-thumb {
      gap: 4px 16px;
    }
    .ctrl-content-wrap.has-thumb .ctrl-desc {
      grid-column: 1;
      grid-row: 2;
      margin-top: 4px;
    }
    .ctrl-content-wrap.has-thumb .thumb-btn {
      grid-column: 2;
      grid-row: 1 / span 2;
    }
  }

  /* Consolidated Place Bar (Option 1: Driver Modal or Instant Copy + 44px Map Pin) */
  .place-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: nowrap;
  }

  .zh-chip {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    max-width: calc(100% - 50px);
    padding: 6px 12px;
    background: var(--navy-tint);
    border: 1.5px solid var(--navy);
    color: var(--navy);
    font-family: var(--font-tc);
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.25;
    text-align: left;
    transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out);
  }
  .zh-chip:hover {
    background: var(--navy);
    color: #FFFFFF;
  }

  .addr-note {
    display: block;
    font-family: var(--font-tc);
    font-size: 0.9375rem;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .sub-places {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--rule);
  }

  .sub-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
  }

  .sub-chip {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 44px;
    padding: 6px 12px;
    display: inline-flex;
    align-items: center;
    text-align: left;
    background: var(--navy-tint);
    border: 1.5px solid var(--navy);
    font-size: 0.9375rem;
    font-weight: 600;
    line-height: 1.3;
    color: var(--navy);
    transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out);
  }
  .sub-chip:hover {
    background: var(--navy);
    color: #FFFFFF;
  }
  .sub-chip:hover .sub-zh, .sub-chip:hover .sub-name { color: #FFFFFF; }

  .sub-chip-label {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 2px 6px;
    min-width: 0;
  }

  .sub-zh {
    font-family: var(--font-tc);
    font-weight: 700;
    color: var(--navy);
  }
  .sub-name {
    color: var(--ink);
    font-weight: 500;
  }

  .map-icon-btn {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    min-width: 44px;
    min-height: 44px;
    border: 1.5px solid var(--lake);
    background: var(--lake-tint);
    color: var(--lake);
    text-decoration: none;
    transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out);
  }
  .map-icon-btn:hover {
    background: var(--lake);
    color: #FFFFFF;
  }

  .action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 44px;
    min-width: 44px;
    padding: 0 12px;
    border: 1.5px solid var(--rule-strong);
    background: var(--paper);
    color: var(--ink);
    font-size: 0.875rem;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
  }
  .action-btn:hover {
    background: var(--ink);
    color: #FFFFFF;
  }
  .action-btn.primary-btn {
    background: var(--navy);
    border-color: var(--navy);
    color: #FFFFFF;
  }
  .action-btn.primary-btn:hover {
    background: var(--ink);
    border-color: var(--ink);
  }
  .action-btn.map-btn {
    border-color: var(--lake);
    color: var(--lake);
  }
  .action-btn.map-btn:hover {
    background: var(--lake);
    color: #FFFFFF;
  }
  .action-btn.copied {
    background: var(--forest);
    border-color: var(--forest);
    color: #FFFFFF;
  }

  /* Landmark Thumbnail beside text */
  .thumb-btn {
    flex-shrink: 0;
    display: block;
    border: 1.5px solid var(--rule-strong);
    background: var(--margin);
    padding: 0;
    overflow: hidden;
    width: 96px;
    height: 68px;
  }

  @media (min-width: 680px) {
    .thumb-btn {
      width: 176px;
      height: 108px;
    }
  }

  .thumb-btn:hover {
    border-color: var(--navy);
  }

  .spot-photo {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .warn-banner {
    margin-top: 8px;
    padding: 8px 12px;
    background: var(--warn-bg);
    border: 1.5px solid var(--warn-line);
    color: var(--warn-ink);
    font-size: 0.9375rem;
    font-weight: 700;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .warn-banner svg { flex-shrink: 0; margin-top: 2px; }

  /* Section Headings (zero kickers/eyebrows) */
  .section-title {
    margin: 26px 0 12px;

  const STORAGE_KEY = "taipei-2026-checklist-v1";

  function getTaipeiToday() {
    try {
      const override = new URLSearchParams(location.search).get("today");
      if (override && /^\d{4}-\d{2}-\d{2}$/.test(override)) return override;
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Taipei",
        year: "numeric", month: "2-digit", day: "2-digit"
      }).format(new Date());
    } catch {
      return "";
    }
  }

  const todayIso = getTaipeiToday();
  const todayDayObj = DAYS.find(d => d.date === todayIso) || null;
  const isDuringTrip = Boolean(todayDayObj);

  let state = {
    tab: "route",
    viewMode: isDuringTrip ? "focus" : "all",
    activeDay: isDuringTrip ? todayDayObj.id : null,
    shopMode: "highlight",
    shopFilter: "ทั้งหมด",
    checked: {}
  };

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    if (saved && typeof saved === "object") state.checked = saved;
  } catch { /* ignore storage errors */ }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, s => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[s]));
  }

  function mapUrl(zh, addr) {
    const q = addr ? `${zh} ${addr}` : zh;
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
  }

  function renderDayRail() {
    const rail = document.getElementById("day-rail");
    const isAll = state.viewMode === "all";
    const allBtn = `
      <button class="all-btn" type="button" id="btn-all-days" aria-pressed="${isAll ? "true" : "false"}">ทุกวัน</button>
    `;
    const dayBtns = DAYS.map(d => {
      const isToday = todayDayObj && todayDayObj.id === d.id;
      const isCurrent = state.viewMode === "focus" && state.activeDay === d.id;
      const shortNum = d.date.split("-").slice(1).reverse().map(Number).join("/");
      const dateHtml = isToday
        ? '<span class="cp-date is-today-date">วันนี้</span>'
        : `<span class="cp-date"><span class="cp-date-short">${esc(shortNum)}</span><span class="cp-date-full">${esc(d.shortDate)}</span></span>`;
      return `
        <button class="cp-btn ${isToday ? "is-today" : ""}" data-zone="${d.zone}" type="button" data-day="${d.id}" aria-current="${isCurrent ? "true" : "false"}" aria-label="${esc(d.title)}">
          <span class="cp-circle">${d.id}</span>
          ${dateHtml}
        </button>
      `;
    }).join("");
    rail.innerHTML = allBtn + dayBtns;
  }

  function formatTimeHtml(t) {
    const s = String(t);
    if (s.includes("–")) {
      const [start, end] = s.split("–");
      return `<span class="time-start">${esc(start)}</span><span class="time-end">–${esc(end)}</span>`;
    }
    return `<span class="time-start">${esc(s)}</span>`;
  }

  async function copyToClipboard(text) {
    if (!text) return false;
    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch { /* fall through to textarea fallback */ }
    }
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch {
      return false;
    }
  }

  function renderRoute() {
    const panel = document.getElementById("panel-route");
    panel.innerHTML = DAYS.map(day => {
      const isHidden = state.viewMode === "focus" && state.activeDay !== day.id;
      const isToday = todayDayObj && todayDayObj.id === day.id;
      const condHtml = day.conditions.map(c => `
        <span class="cond-item">${ICONS[c.icon] || ICONS.clock}<span>${esc(c.text)}</span></span>
      `).join("");

      const rowsHtml = day.items.map(item => {
        const places = item.places || [];
        const titleHtml = esc(item.titlePrefix);
        let actionsHtml = "";

        if (places.length === 1) {
          const p = places[0];
          const addrHtml = p.addr ? `<div class="addr-note" lang="zh-Hant">${esc(p.addr)}</div>` : "";
          const chipHtml = `<button type="button" class="zh-chip driver-btn" data-zh="${esc(p.zh)}" data-addr="${esc(p.addr || "")}" data-sub="${esc(p.name)}" aria-label="ดูชื่อภาษาจีน ${esc(p.name)} (${esc(p.zh)})"><span lang="zh-Hant">${esc(p.zh)}</span></button>`;
          actionsHtml = `
            ${addrHtml}
            <div class="place-bar">
              ${chipHtml}
              <a class="map-icon-btn" href="${mapUrl(p.zh, p.addr)}" target="_blank" rel="noopener noreferrer" aria-label="เปิด Google Maps ${esc(p.name)}" title="เปิด Google Maps">${ICONS.map}</a>
            </div>
          `;
        } else if (places.length > 1) {
          actionsHtml = `
            <div class="sub-places">
              ${places.map(p => {
                const subChip = `<button type="button" class="sub-chip driver-btn" data-zh="${esc(p.zh)}" data-addr="${esc(p.addr || "")}" data-sub="${esc(p.name)}" aria-label="ดูชื่อภาษาจีน ${esc(p.name)} (${esc(p.zh)})"><span class="sub-chip-label"><span class="sub-zh" lang="zh-Hant">${esc(p.zh)}</span><span class="sub-name">· ${esc(p.name)}</span></span></button>`;
                return `
                  <div class="sub-row">

                  </div>
                `;
              }).join("")}
            </div>
          `;
        }

        const thumbHtml = item.img ? `
          <button type="button" class="thumb-btn" data-photo="${esc(item.img)}" data-alt="${esc(item.imgAlt || item.titlePrefix)}" aria-label="ดูภาพขนาดใหญ่ ${esc(item.imgAlt || item.titlePrefix)}">
            <img class="spot-photo" src="${esc(item.img)}" alt="${esc(item.imgAlt || item.titlePrefix)}" width="640" height="360" loading="lazy" decoding="async">
          </button>
        ` : "";

        return `
          <div class="ctrl-row ${item.optional ? "is-optional" : ""}">
            <div class="ctrl-time">${formatTimeHtml(item.time)}</div>
            <div class="ctrl-body">
              <div class="ctrl-content-wrap ${item.img ? "has-thumb" : ""}">
                <div class="ctrl-head-line">
                  <h3 class="place-title">${titleHtml}</h3>
                  <div class="badge-group">
                    ${item.optional ? `<span class="optional-mark">ทางเลือกหน้างาน</span>` : ""}
                    <span class="transit-badge ${item.mode.cls}">${esc(item.mode.label)}</span>
                  </div>
                </div>
                ${thumbHtml}
                <p class="ctrl-desc">${esc(item.desc)}</p>
              </div>
              ${actionsHtml}
              ${item.warn ? `<div class="warn-banner">${ICONS.warn}<span>${esc(item.warn)}</span></div>` : ""}
            </div>
          </div>
        `;
      }).join("");

      return `
        <article class="day-section" id="day-${day.id}" data-zone="${day.zone}" ${isHidden ? "hidden" : ""}>
          <div class="day-header">
            <h2><span class="day-code">${day.id}</span>${esc(day.title)}</h2>
            ${isToday ? '<span class="today-pill">วันนี้</span>' : ""}
          </div>
          <div class="cond-strip">${condHtml}</div>
          <div class="ctrl-table">${rowsHtml}</div>

      `;
    }).join("");

      if (!isFull && !item.highlight) return false;
      if (state.shopFilter !== "ทั้งหมด" && item.cat !== state.shopFilter) return false;
      return true;
    });

    const cardsHtml = visibleItems.map(item => {
      const thumbHtml = item.img ? `
        <button type="button" class="shop-thumb-btn" data-photo="${esc(item.img)}" data-alt="${esc(item.title)}" aria-label="ขยายภาพ ${esc(item.title)}">
          <img src="${esc(item.img)}" alt="${esc(item.title)}" width="480" height="360" loading="lazy" decoding="async">
        </button>
      ` : "";

      return `
        <article class="shop-card ${item.highlight ? "" : "is-extra"}">
          <div class="shop-top">
            ${thumbHtml}
            <div class="shop-head-text">
              <h3 class="shop-title">${esc(item.title)}</h3>
              <div class="shop-brand-row">${esc(item.brand)}</div>
            </div>
          </div>
          <div class="place-bar" style="margin-top:0;">
            <button type="button" class="zh-chip driver-btn" data-zh="${esc(item.zh)}" data-addr="${esc(item.addr || "")}" data-sub="${esc(item.brand)}" aria-label="ดูชื่อภาษาจีน ${esc(item.brand)} (${esc(item.zh)})">
              <span lang="zh-Hant">${esc(item.zh)}</span>
            </button>
            <a class="map-icon-btn" href="${mapUrl(item.zh, item.addr)}" target="_blank" rel="noopener noreferrer" aria-label="เปิด Google Maps ${esc(item.brand)}" title="เปิด Google Maps">${ICONS.map}</a>
          </div>
          <div class="shop-meta">
            <span class="day-tag">${esc(item.day)}</span>
            <span class="price-tag">${esc(item.price)}</span>
            <span class="bag-tag ${item.bag}">${ICONS.bag}${esc(item.bagLabel)}</span>
          </div>
          <p class="shop-note">${esc(item.note)}</p>
        </article>
      `;
    }).join("");

    const contentHtml = visibleItems.length
      ? `<div class="shop-grid">${cardsHtml}</div>`
      : `<div class="shop-empty"><span>ไม่มีรายการในหมวดนี้สำหรับโหมดไฮไลท์</span><button class="action-btn" type="button" id="reset-shop-filter">ดูทั้งหมดในหมวดนี้</button></div>`;

    panel.innerHTML = `
      <div class="shop-controls">
        <div class="mode-group" role="group" aria-label="โหมดดูรายการช้อปปิ้ง">
          <button class="mode-btn" type="button" data-smode="highlight" aria-pressed="${!isFull}">ไฮไลท์ (${SHOP_ITEMS.filter(i => i.highlight).length})</button>
          <button class="mode-btn" type="button" data-smode="full" aria-pressed="${isFull}">ดูทั้งหมด (${SHOP_ITEMS.length})</button>
        </div>
      </div>

      <div class="filter-bar" role="group" aria-label="กรองตามหมวด">${filterBtns}</div>

      <details class="rules-collapse">
        <summary class="rules-summary">
          <span class="rules-lead">${ICONS.warn}<span>กฎสำคัญ: ของเหลวโหลดจบ D6 · ห้ามหมูหยอง/ไข่เหล็ก · Tax Refund ≥NT$2,000</span></span>
          <span class="rules-toggle-hint">ดูครบ 4 ข้อ${ICONS.chevron}</span>
        </summary>
        <div class="rules-body">
          <div><strong>1. เส้นตายโหลด A1 (เช้า D7 เวลา 08:15):</strong> ของเหลว/ครีมเกิน 100 ml (น้ำมันพริก, เซรั่ม) ต้องซื้อให้จบภายใน <strong>D6</strong> เพื่อแพ็กโหลด · เหล้าซื้อหลัง ตม. T2 หิ้วขึ้นเครื่องในถุงซีลได้</div>
          <div><strong>2. ของต้องห้ามเข้าไทยเด็ดขาด:</strong> ผลิตภัณฑ์เนื้อสัตว์ทุกชนิด (หมูหยอง กุนเชียง บะหมี่ซองมีชิ้นเนื้อ/น้ำมันหมู), ไข่เหล็ก (阿婆鐵蛋) และผลิตภัณฑ์กัญชา</div>
          <div><strong>3. Tax Refund 5%:</strong> ช้อปครบ <strong>NT$2,000</strong> ขึ้นไปในร้านที่มีป้าย TRS ภายในวันเดียวกัน ต้องพกพาสปอร์ตตัวจริง</div>
          <div><strong>4. อายุขนมสด:</strong> พายสับปะรด (SunnyHills) และนูกัต (Lotus) มักเก็บได้ราว <strong>15–30 วัน</strong></div>
        </div>
      </details>

      ${contentHtml}
    `;
  }

  function renderPrep() {
    const panel = document.getElementById("panel-prep");
    const doneCount = CHECKLIST_ITEMS.filter(i => state.checked[i.id]).length;

    const listHtml = CHECKLIST_ITEMS.map(item => {
      const checked = Boolean(state.checked[item.id]);
      return `
        <li class="check-item ${checked ? "done" : ""}">
          <label class="check-label">
            <input class="check-input" type="checkbox" data-cid="${item.id}" ${checked ? "checked" : ""}>
            <span class="check-text">${esc(item.text)}</span>
          </label>
        </li>
      `;
    }).join("");

    panel.innerHTML = `
      <h2 class="section-title">สภาพอากาศเดือนธันวาคม</h2>
      <div class="data-grid">
        <div class="data-row cols-2">
          <div class="data-label">สุริยันจันทรา (D1–D3 เช้า)</div>
          <div>ช่วงเช้าเย็น 12–15°C หนาวกว่าไทเปและมีลมแรงบนกระเช้า เตรียมเสื้อคลุมกันหนาวและกันลม</div>
        </div>
        <div class="data-row cols-2">
          <div class="data-label">ไทเป / จิ่วเฟิ่น (D3–D7)</div>
          <div>อุณหภูมิราว 15–20°C มักมีฝนปรอย แนะนำพกร่มและใส่รองเท้าพื้นกันลื่น</div>
        </div>
        <div class="data-row cols-2">
          <div class="data-label">ชายฝั่งเย่หลิ่ว &amp; ตั้นสุ่ย</div>
          <div>ลมมรสุมริมน้ำแรง ช่วงพระอาทิตย์ตกราว 17:05–17:15</div>
        </div>
      </div>

      <div class="check-header">
        <h2 class="section-title">เช็กลิสต์ของเตรียมตัว</h2>
        <div class="check-actions">
          <span class="check-progress">${doneCount}/${CHECKLIST_ITEMS.length} รายการ</span>
          <button class="action-btn" type="button" id="reset-checks">ล้างทั้งหมด</button>
        </div>
      </div>
      <ul class="checklist">${listHtml}</ul>
    `;
  }

  function switchTab(tabName) {
    state.tab = tabName;
    document.querySelectorAll(".nav-tab").forEach(btn => {
      btn.setAttribute("aria-selected", String(btn.dataset.tab === tabName));
    });
    document.getElementById("course-bar").hidden = tabName !== "route";

    ["route", "stay", "souvenirs", "prep"].forEach(name => {
      const panel = document.getElementById(`panel-${name}`);
      const active = name === tabName;
      panel.hidden = !active;
      panel.classList.remove("panel-enter");
      if (active) {
        void panel.offsetWidth;
        panel.classList.add("panel-enter");
      }
    });
  }

  function selectDay(dayId) {
    if (state.viewMode === "focus" && state.activeDay === dayId) {
      state.viewMode = "all";
      state.activeDay = null;
    } else {
      state.viewMode = "focus";
      state.activeDay = dayId;
    }
    renderDayRail();
    renderRoute();
    const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  }

  document.querySelector(".primary-nav").addEventListener("click", e => {
    const btn = e.target.closest("[data-tab]");
    if (btn) switchTab(btn.dataset.tab);
  });

  document.getElementById("day-rail").addEventListener("click", e => {
    if (e.target.closest("#btn-all-days")) {
      state.viewMode = "all";
      state.activeDay = null;
      renderDayRail();
      renderRoute();
      return;
    }
    const btn = e.target.closest("[data-day]");
    if (btn) selectDay(btn.dataset.day);
  });

  const driverDialog = document.getElementById("driver-dialog");
  const photoDialog = document.getElementById("photo-dialog");

  document.getElementById("main-content").addEventListener("click", async e => {
    const driverBtn = e.target.closest(".driver-btn");
    if (driverBtn) {
      const zh = driverBtn.dataset.zh;
      const addr = driverBtn.dataset.addr;
      const sub = driverBtn.dataset.sub;
      document.getElementById("dlg-zh").textContent = zh;
      document.getElementById("dlg-addr").textContent = addr;
      document.getElementById("dlg-sub").textContent = sub;
      document.getElementById("dlg-copy-btn").dataset.copy = addr ? `${zh} ${addr}` : zh;
      document.getElementById("dlg-map-link").href = mapUrl(zh, addr);
      driverDialog.showModal();
      return;
    }

    const thumbBtn = e.target.closest("[data-photo]");
    if (thumbBtn) {
      const altText = thumbBtn.dataset.alt || "ภาพตัวอย่าง";
      document.getElementById("photo-dlg-title").textContent = altText;
      const slot = document.getElementById("photo-dlg-slot");
      slot.innerHTML = `<img class="dlg-photo" src="${esc(thumbBtn.dataset.photo)}" alt="${esc(altText)}">`;
      document.getElementById("photo-dlg-cap").textContent = altText;
      photoDialog.showModal();
      return;
    }

    const smodeBtn = e.target.closest("[data-smode]");
    if (smodeBtn) {
      state.shopMode = smodeBtn.dataset.smode;
      const hasMatches = SHOP_ITEMS.some(item =>
        (state.shopMode === "full" || item.highlight) &&
        (state.shopFilter === "ทั้งหมด" || item.cat === state.shopFilter)
      );
      if (!hasMatches) state.shopFilter = "ทั้งหมด";
      renderSouvenirs();
      return;
    }

    if (e.target.closest("#reset-shop-filter")) {
      state.shopMode = "full";
      renderSouvenirs();
      return;
    }

    const sfilterBtn = e.target.closest("[data-sfilter]");
    if (sfilterBtn) {
      const nextFilter = sfilterBtn.dataset.sfilter;
      state.shopFilter = nextFilter;
      const hasHighlightInCat = SHOP_ITEMS.some(item => item.highlight && (nextFilter === "ทั้งหมด" || item.cat === nextFilter));
      if (state.shopMode === "highlight" && !hasHighlightInCat) {
        state.shopMode = "full";
      }
      renderSouvenirs();
      return;
    }

    if (e.target.closest("#reset-checks")) {
      state.checked = {};
      try { localStorage.setItem(STORAGE_KEY, "{}"); } catch { /* ignore */ }
      renderPrep();
    }
  });

  document.getElementById("panel-prep").addEventListener("change", e => {
    const input = e.target.closest(".check-input");
    if (!input) return;
    state.checked[input.dataset.cid] = input.checked;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.checked)); } catch { /* ignore */ }
    renderPrep();
  });

  document.getElementById("dlg-copy-btn").addEventListener("click", async e => {
    const btn = e.currentTarget;
    if (btn.classList.contains("copied")) return;
    const ok = await copyToClipboard(btn.dataset.copy || "");
    if (ok) {
      btn.classList.add("copied");
      btn.innerHTML = `${ICONS.check}<span>คัดลอกแล้ว</span>`;
      setTimeout(() => {
        btn.classList.remove("copied");
        btn.textContent = "คัดลอกภาษาจีน";
      }, 1400);
    }
  });

  if (!("closedBy" in HTMLDialogElement.prototype)) {
    const outside = (e, dlg) => {
      const r = dlg.getBoundingClientRect();
      return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
    };
    [driverDialog, photoDialog].forEach(dlg => {
      let pressedOutside = false;
      dlg.addEventListener("pointerdown", e => { pressedOutside = outside(e, dlg); });
      dlg.addEventListener("pointerup", e => { if (pressedOutside && outside(e, dlg)) dlg.close(); });
    });
  }

  renderDayRail();
  renderRoute();
  renderStay();
  renderSouvenirs();
  renderPrep();
  const initialHash = location.hash.replace("#", "");
  if (["route", "stay", "souvenirs", "prep"].includes(initialHash)) {
    switchTab(initialHash);
  }
})();
</script>
</body>
</html>
