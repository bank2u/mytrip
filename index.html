<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trips</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧳</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F8F9FA;
            --card: #FFFFFF;
            --text: #264653;
            --muted: #6c757d;
            --line: #e3e6ea;
            --accent: #2A9D8F;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14191c;
                --card: #1d2428;
                --text: #e6ecef;
                --muted: #9aa7ae;
                --line: #2c363b;
                --accent: #4fc3b4;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 32px 16px;
        }

        main {
            max-width: 560px;
            margin: 0 auto;
        }

        h1 {
            font-weight: 600;
            font-size: 1.75rem;
            margin: 0 0 24px;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 12px;
        }

        a.trip {
            display: flex;
            align-items: center;
            gap: 16px;
            min-height: 72px;
            padding: 16px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: inherit;
            text-decoration: none;
        }

        a.trip:hover,
        a.trip:focus-visible {
            border-color: var(--accent);
        }

        .flag {
            font-size: 2rem;
            line-height: 1;
        }

        .name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .meta {
            color: var(--muted);
            font-weight: 300;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <main>
        <h1>🧳 My Trips</h1>
        <ul>
            <!-- Newest first. One entry per published [yyyy]-[place]/index.html -->
            <li>
                <a class="trip" href="2026-kuala-lumpur/">
                    <span class="flag">🇲🇾</span>
                    <span>
                        <div class="name">กัวลาลัมเปอร์ · Kuala Lumpur</div>
                        <div class="meta">4–7 เม.ย. 2026 · 4 วัน 3 คืน</div>
                    </span>
                </a>
            </li>
            <li>
                <a class="trip" href="2025-vietnam/">
                    <span class="flag">🇻🇳</span>
                    <span>
                        <div class="name">เวียดนาม · Saigon – Dalat – Mui Ne</div>
                        <div class="meta">30 ธ.ค. 2025 – 4 ม.ค. 2026</div>
                    </span>
                </a>
            </li>
        </ul>
    </main>
</body>

</html>
